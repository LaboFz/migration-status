<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaboFz — Suivi de bascule</title>
<style>
  :root {
    --bg: #f5f6f4;
    --card: #ffffff;
    --border: #dde1dc;
    --text: #1f2a24;
    --muted: #6b7770;
    --accent: #0f6e63;
    --accent-soft: #e3efec;
    --warn: #b4530f;
    --warn-soft: #fbeee2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141815;
      --card: #1c211d;
      --border: #2c332d;
      --text: #e8ece9;
      --muted: #93a19a;
      --accent: #4fd8c4;
      --accent-soft: #16302c;
      --warn: #e6a15c;
      --warn-soft: #332417;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 32px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  .eyebrow {
    text-transform: uppercase; letter-spacing: .08em; font-size: 11px;
    color: var(--accent); font-weight: 600; margin-bottom: 6px;
  }
  h1 { margin: 0 0 6px; font-size: 24px; }
  .updated { color: var(--muted); font-size: 13px; }

  .overall {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; margin-bottom: 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .overall .num { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .overall .label { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .ring { width: 64px; height: 64px; flex: none; }

  .phase {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; margin-bottom: 10px;
  }
  .phase-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .phase-top .name { font-weight: 600; font-size: 14.5px; }
  .phase-top .pct { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .bar { height: 8px; border-radius: 5px; background: var(--accent-soft); overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 5px; transition: width .5s ease; }
  .phase.attention .bar { background: var(--warn-soft); }
  .phase.attention .bar > div { background: var(--warn); }
  .tag {
    display: inline-block; margin-left: 8px; font-size: 11px; padding: 1px 7px;
    border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 600;
  }

  footer { margin-top: 28px; color: var(--muted); font-size: 12px; text-align: center; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">LaboFz</div>
    <h1>Suivi de la bascule</h1>
    <div class="updated" id="updated">Chargement…</div>
  </header>

  <div class="overall" id="overall" hidden>
    <div>
      <div class="num" id="overall-num">0%</div>
      <div class="label">avancement global</div>
    </div>
    <svg class="ring" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="27" fill="none" stroke="var(--accent-soft)" stroke-width="7"/>
      <circle id="ring-fg" cx="32" cy="32" r="27" fill="none" stroke="var(--accent)" stroke-width="7"
              stroke-dasharray="169.6" stroke-dashoffset="169.6" stroke-linecap="round"
              transform="rotate(-90 32 32)"/>
    </svg>
  </div>

  <div id="phases"></div>
  <div class="empty" id="empty" hidden>Pas de bascule en cours pour le moment.</div>

  <footer>Actualisé automatiquement toutes les 15 secondes.</footer>
</div>

<script>
async function refresh() {
  try {
    const res = await fetch('progress.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('updated').textContent = 'Statut indisponible pour le moment.';
  }
}

function render(data) {
  document.getElementById('updated').textContent = 'Dernière mise à jour : ' + data.updated_at;

  const overallEl = document.getElementById('overall');
  overallEl.hidden = false;
  document.getElementById('overall-num').textContent = data.overall_percent + '%';
  const circumference = 169.6;
  const offset = circumference * (1 - data.overall_percent / 100);
  document.getElementById('ring-fg').style.strokeDashoffset = offset;

  const container = document.getElementById('phases');
  const empty = document.getElementById('empty');
  if (!data.phases || data.phases.length === 0) {
    container.innerHTML = '';
    empty.hidden = false;
    return;
  }
  empty.hidden = true;
  container.innerHTML = data.phases.map(p => `
    <div class="phase ${p.attention ? 'attention' : ''}">
      <div class="phase-top">
        <span class="name">${p.label}${p.attention ? '<span class="tag">à vérifier</span>' : ''}</span>
        <span class="pct">${p.percent}%</span>
      </div>
      <div class="bar"><div style="width:${p.percent}%"></div></div>
    </div>
  `).join('');
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
